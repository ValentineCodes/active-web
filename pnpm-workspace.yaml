packages:
  - apps/*

# Metro resolves transitive dependencies (NativeWind's jsx runtime, for one) as if they
# were top level, which pnpm's default strict layout does not expose. React Native needs
# a flat node_modules.
nodeLinker: hoisted

allowBuilds:
  # Downloads the platform-native binary the ESLint import resolver runs on.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.24'
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo@57.0.22
  - '@expo/ui@57.0.18'
  - expo-application@57.0.3
  - expo-device@57.0.2
  - expo-glass-effect@57.0.3
  - expo-haptics@57.0.3
  - expo-image-picker@57.0.17
  - expo-image@57.0.5
  - expo-linking@57.0.10
  - expo-location@57.0.17
  - expo-notifications@57.0.18
  - expo-router@57.0.21
  - expo-secure-store@57.0.4
  - expo-symbols@57.0.3
  - expo-web-browser@58.0.6
